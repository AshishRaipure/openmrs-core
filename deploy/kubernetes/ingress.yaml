apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmrs
  namespace: openmrs
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: openmrs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openmrs
                port:
                  number: 80
